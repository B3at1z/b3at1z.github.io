<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PLAYBOX SIDOARJO</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #05070a;
        color: #ffffff;
        font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
        overflow-x: hidden;
      }

      /* glow merah halus di background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 15% 10%, rgba(255, 40, 60, 0.12), transparent 42%),
          radial-gradient(circle at 85% 90%, rgba(255, 0, 80, 0.10), transparent 42%),
          radial-gradient(circle at 50% 50%, rgba(255, 60, 0, 0.06), transparent 60%);
        z-index: 0;
        pointer-events: none;
      }

      /* ===== HEADER ===== */
      #brand {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 14px 12px 12px;
        background: rgba(8, 8, 12, 0.85);
        border-bottom: 1px solid rgba(255, 40, 60, 0.35);
        box-shadow: 0 0 24px rgba(255, 40, 60, 0.12);
      }
      #brand img {
        width: 36px;
        height: 36px;
        margin-right: 10px;
        border-radius: 50%;
        vertical-align: middle;
        filter: drop-shadow(0 0 8px rgba(255, 40, 60, 0.7));
      }
      #brand b {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.18em;
        color: #ffffff;
        vertical-align: middle;
        text-shadow:
          0 0 8px rgba(255, 40, 60, 0.9),
          0 0 18px rgba(255, 40, 60, 0.5);
      }
      #brand::after {
        content: "";
        display: block;
        height: 1px;
        margin-top: 10px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 40, 60, 0.7) 50%,
          transparent 100%
        );
      }

      /* ===== CARD TENGAH ===== */
      #centerWrap {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        padding: 0 18px;
        z-index: 2;
        display: flex;
        justify-content: center;
        pointer-events: none;
      }

      #card {
        width: 100%;
        max-width: 520px;
        text-align: center;
        border: 1px solid rgba(255, 40, 60, 0.35);
        border-radius: 12px;
        padding: 30px 20px 26px;
        background: rgba(10, 8, 12, 0.65);
        box-shadow:
          0 0 0 1px rgba(255, 40, 60, 0.08) inset,
          0 0 32px rgba(255, 40, 60, 0.15),
          0 0 64px rgba(255, 40, 60, 0.06);
        position: relative;
        overflow: hidden;
        animation: cardPulse 3s ease-in-out infinite;
        pointer-events: auto;
      }

      #card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 40, 60, 0.9) 50%,
          transparent 100%
        );
      }

      @keyframes cardPulse {
        0%, 100% {
          box-shadow:
            0 0 0 1px rgba(255, 40, 60, 0.08) inset,
            0 0 24px rgba(255, 40, 60, 0.12),
            0 0 48px rgba(255, 40, 60, 0.05);
        }
        50% {
          box-shadow:
            0 0 0 1px rgba(255, 40, 60, 0.15) inset,
            0 0 40px rgba(255, 40, 60, 0.25),
            0 0 80px rgba(255, 40, 60, 0.10);
        }
      }

      /* ===== SPINNER (di dalam card) ===== */
      #spin {
        width: 56px;
        height: 56px;
        margin: 0 auto 22px;
        border: 4px solid rgba(255, 40, 60, 0.15);
        border-top-color: #ff283c;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        filter: drop-shadow(0 0 8px rgba(255, 40, 60, 0.8));
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ===== TEKS TUNGGU ===== */
      #waitText {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.10em;
        color: #ffffff;
        text-shadow:
          0 0 8px rgba(255, 40, 60, 0.9),
          0 0 20px rgba(255, 40, 60, 0.5);
        animation: waitPulse 2.4s ease-in-out infinite;
      }
      @keyframes waitPulse {
        0%, 100% {
          text-shadow:
            0 0 8px rgba(255, 40, 60, 0.9),
            0 0 20px rgba(255, 40, 60, 0.5);
        }
        50% {
          text-shadow:
            0 0 12px rgba(255, 40, 60, 1),
            0 0 32px rgba(255, 40, 60, 0.8),
            0 0 48px rgba(255, 40, 60, 0.4);
        }
      }

      /* ===== PESAN SUKSES / GAGAL ===== */
      #okMsg, #failMsg {
        display: none;
      }
      #okMsg .big, #failMsg .big {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #ffffff;
        margin-bottom: 14px;
        animation: msgPulse 1.8s ease-in-out infinite;
      }
      #okMsg .small, #failMsg .small {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #ffffff;
        line-height: 1.6;
        text-shadow: 0 0 6px rgba(255, 40, 60, 0.6);
      }
      @keyframes msgPulse {
        0%, 100% {
          text-shadow:
            0 0 10px rgba(255, 40, 60, 1),
            0 0 26px rgba(255, 40, 60, 0.7);
        }
        50% {
          text-shadow:
            0 0 16px rgba(255, 40, 60, 1),
            0 0 40px rgba(255, 40, 60, 0.9),
            0 0 64px rgba(255, 40, 60, 0.5);
        }
      }

      /* tampilkan sesuai state body */
      body.done  #okMsg   { display: block; }
      body.fail  #failMsg { display: block; }
      body.log   #okMsg,
      body.log   #failMsg { display: none; }

      /* sembunyikan spinner & waitText saat selesai/gagal */
      body.done #spin,
      body.fail #spin { display: none; }
      body.done #waitText,
      body.fail #waitText,
      body.log  #waitText { display: none; }

      /* ===== MODE LOG (?log=1) ===== */
      #wrap {
        position: relative;
        z-index: 2;
        padding: 0;
      }
      #state, #out {
        display: none;
      }
      body.log #centerWrap { display: none; }
      body.log #wrap { padding: 14px 18px; }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        margin: 0 0 8px;
        color: #ffffff;
        text-shadow:
          0 0 8px rgba(255, 40, 60, 0.9),
          0 0 20px rgba(255, 40, 60, 0.5);
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: rgba(10, 8, 12, 0.85);
        border: 1px solid rgba(255, 40, 60, 0.35);
        border-radius: 8px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        color: #ffffff;
        box-shadow: 0 0 24px rgba(255, 40, 60, 0.12);
      }

      .ok     { color: #ffffff; }
      .bad    { color: #ffffff; }
      .warn   { color: #ffffff; }
      .safe   { color: #ffffff; }
      .danger { color: #ffffff; }
      code    { color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="logo.png" alt="" width="36" height="36" /><b>PLAYBOX SIDOARJO</b>
    </div>

    <div id="centerWrap">
      <div id="card">
        <div id="spin"></div>
        <div id="waitText">MOHON DITUNGGU, PS4 SEDANG DALAM PROSES MEMBUKA GAME YANG TERKUNCI..!</div>

        <div id="okMsg">
          <div class="big">Proses Membuka Kunci Game Berhasil..!</div>
          <div class="small">Silahkan Keluar dari Browser dengan Klik Tombol O</div>
        </div>

        <div id="failMsg">
          <div class="big">Proses Membuka Kunci Game Gagal..!</div>
          <div class="small">Mohon Restart PS4, Kemudian Jalankan Ulang Prosesnya</div>
        </div>
      </div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
