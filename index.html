<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAYBOX SIDOARJO</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #05070a;
    color: #ffffff;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* glow merah halus di background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 40, 60, 0.12), transparent 42%),
      radial-gradient(circle at 85% 90%, rgba(255, 0, 80, 0.10), transparent 42%),
      radial-gradient(circle at 50% 50%, rgba(255, 60, 0, 0.06), transparent 60%);
    z-index: 0;
    pointer-events: none;
  }

  #brand, #wrap {
    position: relative;
    z-index: 1;
  }

  /* ===== HEADER ===== */
  #brand {
    text-align: center;
    padding: 14px 12px 12px;
    background: rgba(8, 8, 12, 0.85);
    border-bottom: 1px solid rgba(255, 40, 60, 0.35);
    box-shadow: 0 0 24px rgba(255, 40, 60, 0.12);
  }
  #brand img {
    width: 36px;
    height: 36px;
    margin-right: 10px;
    border-radius: 50%;
    vertical-align: middle;
    filter: drop-shadow(0 0 8px rgba(255, 40, 60, 0.7));
  }
  #brand b {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .18em;
    color: #ffffff;
    vertical-align: middle;
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 18px rgba(255, 40, 60, 0.5);
  }
  #brand::after {
    content: "";
    display: block;
    height: 1px;
    margin-top: 10px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 40, 60, 0.7) 50%,
      transparent 100%
    );
  }

  /* ===== LAYOUT ===== */
  #wrap {
    padding: 28px 18px 110px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 100px);
  }

  /* ===== CARD GAMING ===== */
  #card {
    width: 100%;
    max-width: 520px;
    text-align: center;
    border: 1px solid rgba(255, 40, 60, 0.35);
    border-radius: 12px;
    padding: 26px 20px 22px;
    background: rgba(10, 8, 12, 0.65);
    box-shadow:
      0 0 0 1px rgba(255, 40, 60, 0.08) inset,
      0 0 32px rgba(255, 40, 60, 0.15),
      0 0 64px rgba(255, 40, 60, 0.06);
    position: relative;
    overflow: hidden;
    animation: cardPulse 3s ease-in-out infinite;
  }
  #card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 40, 60, 0.9) 50%,
      transparent 100%
    );
  }
  @keyframes cardPulse {
    0%, 100% {
      box-shadow:
        0 0 0 1px rgba(255, 40, 60, 0.08) inset,
        0 0 24px rgba(255, 40, 60, 0.12),
        0 0 48px rgba(255, 40, 60, 0.05);
    }
    50% {
      box-shadow:
        0 0 0 1px rgba(255, 40, 60, 0.15) inset,
        0 0 40px rgba(255, 40, 60, 0.25),
        0 0 80px rgba(255, 40, 60, 0.10);
    }
  }

  /* ===== TEKS ===== */
  #state {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .08em;
    margin: 0 0 10px;
    color: #ffffff;
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 20px rgba(255, 40, 60, 0.5);
    animation: statePulse 2.4s ease-in-out infinite;
  }
  @keyframes statePulse {
    0%, 100% {
      text-shadow:
        0 0 8px rgba(255, 40, 60, 0.9),
        0 0 20px rgba(255, 40, 60, 0.5);
    }
    50% {
      text-shadow:
        0 0 12px rgba(255, 40, 60, 1),
        0 0 32px rgba(255, 40, 60, 0.8),
        0 0 48px rgba(255, 40, 60, 0.4);
    }
  }

  #det {
    font-size: 13px;
    color: #ffffff;
    margin: 0 0 8px;
    letter-spacing: .04em;
    text-shadow: 0 0 6px rgba(255, 40, 60, 0.5);
  }
  #det b {
    color: #ffffff;
    font-weight: 700;
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 16px rgba(255, 40, 60, 0.5);
  }

  #cache {
    font-size: 12px;
    color: #ffffff;
    margin: 0;
    min-height: 14px;
    letter-spacing: .06em;
    text-shadow: 0 0 6px rgba(255, 40, 60, 0.4);
  }
  #cache.cacheok {
    color: #ffffff;
    text-shadow:
      0 0 8px rgba(255, 40, 60, 0.9),
      0 0 16px rgba(255, 40, 60, 0.5);
  }

  .ok   { color: #ffffff !important; }
  .bad  { color: #ffffff !important;
          text-shadow: 0 0 10px rgba(255, 40, 60, 1), 0 0 24px rgba(255, 40, 60, 0.7) !important; }
  .warn { color: #ffffff !important;
          text-shadow: 0 0 10px rgba(255, 40, 60, 1), 0 0 24px rgba(255, 40, 60, 0.7) !important; }

  /* ===== FOOTER ===== */
  #footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 2;
    text-align: center;
    padding: 10px 14px 12px;
    font-size: 11px;
    letter-spacing: 0.06em;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.6);
    background: rgba(5, 7, 10, 0.7);
    border-top: 1px solid rgba(255, 40, 60, 0.25);
    text-shadow: 0 0 6px rgba(255, 40, 60, 0.3);
  }
  #footer b {
    color: #ffffff;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(255, 40, 60, 0.6);
  }
  #footer .row {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #footer .sep {
    color: rgba(255, 40, 60, 0.7);
    margin: 0 4px;
  }
  #footer a {
    color: #ffffff;
    text-decoration: none;
    border-bottom: 1px dotted rgba(255, 40, 60, 0.6);
    text-shadow: 0 0 6px rgba(255, 40, 60, 0.5);
  }
  #footer a:hover {
    border-bottom-color: #ffffff;
  }
</style>
</head>
<body>
<div id="brand"><img src="logo.png" alt="" width="36" height="36"><b>PLAYBOX SIDOARJO</b></div>
<div id="wrap">
  <div id="card">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</div>

<div id="footer">
  <span class="row">
    Author <b>© 2026 playbox sidoarjo</b>
    <span class="sep">·</span>
    GoldHEN <b>v2.4b18.12</b>
    <span class="sep">·</span>
    Credit <b>raw13g</b>
  </span>
  <span class="row">
    Kontak
    <a href="https://wa.me/6285943796979">WA 085943796979</a>
    <span class="sep">·</span>
    TikTok <a href="https://www.tiktok.com/@playbox.sidoarjo">playbox.sidoarjo</a>
    <span class="sep">·</span>
    IG <a href="https://www.instagram.com/playbox.sidoarjo">playbox.sidoarjo</a>
  </span>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- klik X untuk menmbuka game yang terkunci..!", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- klik X untuk menmbuka game yang terkunci..!",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- klik X untuk menmbuka game yang terkunci..!", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- klik X untuk menmbuka game yang terkunci..!",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- klik X untuk menmbuka game yang terkunci..!", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- klik X untuk menmbuka game yang terkunci..!", go);
        }, false);
    }
})();
</script>
</body>
</html>
